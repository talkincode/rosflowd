[package]
name = "rosflowd"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Headless RouterOS flow collector daemon"
repository = "https://github.com/talkincode/rosflowd"
readme = "README.md"

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
hkdf = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
