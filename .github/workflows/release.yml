name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: rosflowd-linux-amd64
          - runner: ubuntu-24.04-arm
            asset: rosflowd-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: nDPI
        run: bash scripts/ci-ndpi.sh
      - name: build
        run: cargo build --release --locked
      - name: pack
        run: |
          cp target/release/rosflowd "${{ matrix.asset }}"
          tar -czf "${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          sha256sum "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.tar.gz.sha256
