[package]
name = "rosflowd"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Headless RouterOS flow collector daemon"
repository = "https://github.com/talkincode/rosflowd"
readme = "README.md"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
